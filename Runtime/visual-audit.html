<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <base href="/Runtime/">
  <title>VSL Runtime Visual Audit</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./runtime-fixes.css">
</head>
<body><main id="app">
  <section class="scene relic" data-scene="relic">
    <p class="eyebrow">RELIC AUCTION</p>
    <div id="relic-card"><p>HIGH · ROUND 3/3</p><h2>황금 낙찰봉</h2><p>다음 여정의 감정 비용이 감소합니다.</p><strong>현재 입찰가 25,000 G</strong></div>
    <div class="actions"><button id="buy-relic">10% 인상 입찰</button><button id="skip-relic" class="secondary">물러나기</button></div>
  </section>
  <section class="scene result" data-scene="result" hidden>
    <p class="eyebrow">RUN RESULT</p><h2 id="result-title">12일 여정 완료</h2>
    <div id="run-summary"><p>현금 48,200 G · 미판매 자산 12,500 G</p><p>낙찰 17건 · 완료 의뢰 6건 · 상회 4단계</p><p>획득 유물 황금 낙찰봉</p></div>
    <button id="return-title">타이틀로</button>
  </section>
  <section class="scene result is-failure" data-scene="result" data-audit="result-failure" hidden>
    <p class="eyebrow">RUN RESULT</p><h2>여정 실패</h2>
    <div id="run-summary"><p class="failure">기한까지 상회를 확장하지 못했습니다.</p><p>현금 4,300 G · 미판매 자산 2,100 G</p><p>낙찰 5건 · 완료 의뢰 1건 · 상회 1단계</p></div>
    <button id="return-title">타이틀로</button>
  </section>
</main>
<script>
  const requested = new URLSearchParams(location.search).get('scene') || 'relic';
  document.querySelectorAll('.scene').forEach((scene) => { scene.hidden = (scene.dataset.audit || scene.dataset.scene) !== requested; });
</script></body></html>
