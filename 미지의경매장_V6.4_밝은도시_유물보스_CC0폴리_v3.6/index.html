/* 6.2 품질 추첨. 기대값 1.0075 · 표준편차 0.2585 */
function pickQuality(){let x=Math.random()*100;for(const q of QUALITY_TABLE){x-=q[2];if(x<=0)return q[0]}return 1.60}
function qualityLabel(k){const r=QUALITY_TABLE.find(q=>Math.abs(q[0]-k)<0.001);return r?r[1]:''}
/* 6.13 등급 민감도 β. 같은 계열 지수라도 등급이 높을수록 시세가 크게 흔들린다 */
const GRADE_BETA={common:0.27,rare:1.00,epic:2.09,legendary:3.64};
function demandOf(item){const idx=(state.market&&state.market[item.family])||1;return 1+GRADE_BETA[item.grade]*(idx-1)}
/* 6.3 감정 정밀도는 일차가 정한다 */

function nemesisStage(day=state?.day||1){return day<=3?0:day<=6?1:day<=9?2:3}

function money(n){return `${Math.round(Number(n)||0).toLocaleString('ko-KR')} G`}
function pct(n){return `${Math.round(n*100)}%`}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function rnd(a=1,b=null){if(b===null){b=a;a=0}return a+Math.random()*(b-a)}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function round10(n){return Math.ceil(n/10)*10}
function round100(n){return Math.ceil(n/100)*100}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

function applySettings(){document.body.classList.toggle('high-contrast',!!settings.contrast);document.documentElement.style.fontSize=`${settings.textScale}%`;Sound.setVolumes({master:settings.masterVolume/100,bgm:settings.bgmVolume/100,sfx:settings.sfxVolume/100})}
function toast(msg,bad=false){Sound.onToast(bad);const d=document.createElement('div');d.className='toast'+(bad?' bad':'');d.textContent=msg;document.getElementById('toast-root').append(d);setTimeout(()=>d.remove(),2800)}
function topbar(extra=''){if(!state||['title','continue','loading'].includes(state.scene))return '';const cap=storageCap();const deadline=deadlineText();const canCity=['office','tavern','exchange','guild','merchant','museum'].includes(state.scene)&&!state.daily?.settlement;return `<div class="topbar"><div class="brand">미지의 경매장 V6</div><span class="chip">${state.day} / 12일</span><span class="chip">${stageName(state.shopStage)}</span><span class="chip money">${money(state.cash)}</span><span class="chip">보관 ${activeInventory().length}/${cap}</span>${deadline?`<span class="chip warn">${deadline}</span>`:''}${canCity?'<button class="ghost" onclick="Game.goCity()">도시</button>':''}<button class="ghost" onclick="Game.saveCurrent()">저장</button><button class="ghost" onclick="Game.openSettings()">설정</button>${extra}</div>`}
function stageName(s){return ['','골동품점','지역 상회','유명 상회','대상회'][s]}
function storageCap(){return CFG.STORAGE[state.shopStage]+(hasRelic('leather-ledger')&&state.shopStage===1?1:0)}
function activeInventory(){return state.inventory.filter(x=>!x.sold&&!x.seized)}
function feeRate(){return CFG.FEES[state.shopStage]}
function infoDiscount(){return 1-CFG.INFO_DISCOUNT[state.shopStage]}
function setBonus(){return 1+CFG.SET_BONUS[state.shopStage]+(hasRelic('family-crest')?.2:0)}
function questBonus(){return 1+CFG.QUEST_BONUS[state.shopStage]}
function scale(day=state.day){return Math.pow(CFG.GROWTH,day-1)}
function disposalValue(item){return round10(item.basePrice*item.quality*demandOf(item))}
function deadlineText(){if(state.day<=3)return `4일차 개시 전 2단계`;if(state.day<=6)return `7일차 개시 전 3단계`;if(state.day<=9)return `10일차 개시 전 4단계`;return ''}
function requiredStageForDay(day){if(day>=10)return 4;if(day>=7)return 3;if(day>=4)return 2;return 1}
function newRun(slot=1){const meta=getMeta();let start=CFG.START_CASH+Math.round(meta.carry||0);if(meta.relics.includes('old-scale'))start=Math.round(start*1.1);state={version:6,slot,scene:'loading',day:1,cash:start,startDayCash:start,shopStage:1,completedQuestsTotal:0,inventory:[],market:Object.fromEntries(FAMILIES.map(f=>[f[0],1])),marketSchedule:makeMarketSchedule(),nemesis:{id:'bennett',name:'숙적 베넷',target:pick(FAMILIES)[0],cash:25000,growth:1.155},tycoons:makeTycoonProfiles(),daily:null,loan:null,guildLocked:false,finalAuction:null,runResults:[],runEnded:false,runStartCash:start,settingsSeen:false};saveState(slot);render();runLoading()}
function makeMarketSchedule(){return Array.from({length:12},(_,i)=>{const e=pick(MARKET_EVENTS);return{day:i+1,family:e[0],delta:e[1],text:e[2]}})}
function makeLots(day){let grades=['common','common','rare','rare','rare','epic'];if(Math.random()<.65)grades.push('rare');else grades.push('epic');grades.push(Math.random()<.35?'legendary':'rare');grades=shuffle(grades);return grades.slice(0,8).map((g,i)=>{const f=pick(FAMILIES);const base=round100(GRADES[g].base*scale(day));const quality=pickQuality();return{id:`D${day}L${i+1}-${Math.random().toString(36).slice(2,7)}`,order:i+1,name:pick(ITEM_NAMES[f[0]]),family:f[0],grade:g,basePrice:base,quality,startingPrice:round100(base*.5),appraisal:null,wonBy:null,finalPrice:0}})}
function makeDaily(){const ev=state.marketSchedule[state.day-1];state.market[ev.family]=Number(clamp(state.market[ev.family]+ev.delta,.6,1.6).toFixed(2));const lots=makeLots(state.day);const questCount=hasRelic('royal-charter')?5:3;const qoffers=shuffle(QUESTS).slice(0,questCount).map(q=>({...q,targetFamily:pick(FAMILIES)[0],targetBot:state.day===1?'drifter-a':'bennett'}));state.startDayCash=state.cash;state.daily={phase:'city',lots,lotIndex:0,questOffers:qoffers,acceptedQuests:[],appraisals:{},appraisalOfferIds:shuffle(lots).slice(0,4).map(x=>x.id),info:{forecast:false,catalog:false,competitors:false},auctionResults:[],expense:0,income:0,logs:[],event:ev,freeForecastUsed:false,botSpend:{},settlement:false};state.daily.bots=makeBots();if(hasRelic('compass'))state.daily.info.forecast=true;if(hasRelic('broker-card'))state.daily.info.catalog=true;if(hasRelic('magnifier'))state.daily.info.competitors=true;state.scene='city';saveState();render();if(settings.tutorial&&state.day===1&&!state.settingsSeen)showTutorial()}
function startDay(){const req=requiredStageForDay(state.day);if(state.shopStage<req){endRun('deadline',`${state.day}일차 개시 마감까지 ${req}단계에 도달하지 못했습니다.`);return}processLoanDue();if(state.runEnded)return;makeDaily()}
function processLoanDue(){if(!state.loan)return;if(state.day>state.loan.dueDay){const item=state.inventory.find(x=>x.id===state.loan.collateralId);if(item){item.seized=true;item.locked=false}state.loan=null;state.guildLocked=true;Sound.playAction('act-process-loan-due');toast('대출 미상환으로 담보가 압류되고 조합 거래가 제한되었습니다.',true)}}
function bankruptcyCheck(){const canLoan=state.shopStage>=3&&!state.guildLocked&&!state.loan&&activeInventory().some(x=>!x.locked);if(state.cash<=0&&activeInventory().length===0&&!canLoan){endRun('bankruptcy','자금 0 + 보유품 0 + 대출 불가 상태입니다.');return true}return false}
function runLoading(){let p=0;const logs=['도시의 시장 사건을 조립합니다.','출품 96점의 템플릿을 준비합니다.','경쟁자 지갑과 표적을 배치합니다.','재현 가능한 고정 엔진 상태를 저장합니다.'];const timer=setInterval(()=>{p+=25;const bar=document.getElementById('loadingBar');if(bar)bar.style.width=p+'%';const log=document.getElementById('loadingLog');if(log)log.innerHTML=logs.slice(0,p/25).map(x=>`<div>• ${x}</div>`).join('');if(p>=100){clearInterval(timer);setTimeout(startDay,350)}},260)}
function saveState(slot=state?.slot||1){if(!state)return;state.slot=slot;localStorage.setItem(CFG.SAVE_PREFIX+slot,JSON.stringify(state))}
function loadState(slot){try{const s=JSON.parse(localStorage.getItem(CFG.SAVE_PREFIX+slot));if(!s)throw 0;state=s;state.slot=slot;if(!state.tycoons)state.tycoons=makeTycoonProfiles();if(state.daily?.auction?.current&&!state.daily.auction.current.botPlans){const l=state.daily.lots[state.daily.lotIndex];state.daily.auction.current.botPlans=Object.fromEntries((state.daily.auction.bots||[]).map(b=>[b.id,makeBotLotPlan(b,l)]))}render()}catch{toast('저장 데이터를 불러오지 못했습니다.',true)}}
function deleteState(slot){localStorage.removeItem(CFG.SAVE_PREFIX+slot);renderContinue()}
function openConfirm(title,text,onConfirm){modal={type:'confirm',title,text,onConfirm};renderModal()}
function closeModal(){modal=null;renderModal()}
function openSettings(){modal={type:'settings'};renderModal()}
function showTutorial(){state.settingsSeen=true;document.body.insertAdjacentHTML('beforeend',`<div class="tutorial" id="tutorial"><div class="tutorial-card"><h1>첫 여정 안내</h1><p>도시에서 의뢰와 정보를 고른 뒤 경매장에 들어갑니다. 낙찰품은 다음 날부터 거래소에서 팔 수 있습니다.</p><div class="grid two"><div class="panel"><h3>마감</h3><p>4·7·10일차 개시 전까지 상회를 승급해야 합니다.</p></div><div class="panel"><h3>가치</h3><p>계열·등급·기준가는 공개되지만 품질과 실가치는 숨겨집니다.</p></div></div><div class="modal-actions"><button class="primary" onclick="document.getElementById('tutorial').remove();Game.saveCurrent()">시작</button></div></div></div>`)}
function render(){applySettings();if(!state){renderTitle();return}switch(state.scene){case'title':renderTitle();break;case'continue':renderContinue();break;case'loading':renderLoading();break;case'city':renderCity();break;case'office':renderOffice();break;case'tavern':renderTavern();break;case'exchange':renderExchange();break;case'guild':renderGuild();break;case'merchant':renderMerchant();break;case'museum':renderMuseum();break;case'auction':renderAuction();break;case'summary':renderSummary();break;case'ending':renderEnding();break;case'final':renderFinalAuction();break;case'result':renderResult();break;default:renderTitle()}renderModal();renderQA();Sound.setScene(`scene-${state.scene}`,state)}
function renderTitle(){state=state&&state.scene==='title'?state:null;document.getElementById('app').innerHTML=`<section class="scene title-scene"><button class="image-button corner-settings" onclick="Game.openSettings()"><img src="assets/runtime/ui/icons/settings.png" alt="설정"></button><div class="title-menu"><button class="image-button" onclick="Game.newRun(1)"><img src="assets/runtime/ui/buttons/new-game.png" alt="새 게임"></button><button class="image-button" onclick="Game.openContinue()"><img src="assets/runtime/ui/buttons/continue.png" alt="이어하기"></button><button class="image-button" onclick="Game.openMuseumFromTitle()"><img src="assets/runtime/ui/buttons/museum.png" alt="유물 전시관"></button><button class="image-button" onclick="Game.exitGame()"><img src="assets/runtime/ui/buttons/exit.png" alt="게임 종료"></button></div></section>`;Sound.setScene('scene-title',null)}
function openContinue(){state={scene:'continue'};render()}
function openMuseumFromTitle(){state={scene:'museum',fromTitle:true,inventory:[],cash:0,shopStage:1,day:1};render()}
function exitGame(){toast('브라우저에서는 창을 직접 닫을 수 없습니다. 탭을 닫아주세요.')}
function renderContinue(){document.getElementById('app').innerHTML=`<section class="scene continue-scene"><div class="screen"><div class="save-slots">${[1,2,3].map(slot=>{let s=null;try{s=JSON.parse(localStorage.getItem(CFG.SAVE_PREFIX+slot))}catch{}return `<div class="save-slot"><div>${s?`<h2>저장 ${slot} · ${s.day}일차</h2><p>${stageName(s.shopStage)} · 자금 ${money(s.cash)} · 보유품 ${(s.inventory||[]).filter(x=>!x.sold&&!x.seized).length}점</p>`:`<h2>빈 슬롯 ${slot}</h2><p class="muted">저장된 여정이 없습니다.</p>`}</div><div class="row"><button ${s?'':'disabled'} onclick="Game.loadSlot(${slot})">이어하기</button><button class="danger" ${s?'':'disabled'} onclick="Game.askDelete(${slot})">삭제</button></div></div>`}).join('')}<div class="row between"><button onclick="Game.backTitle()">타이틀로 돌아가기</button><button onclick="Game.openSettings()">설정</button></div></div></div></section>`}
function renderLoading(){document.getElementById('app').innerHTML=`<section class="scene loading-scene"><div class="screen" style="display:grid;place-items:center"><div class="panel" style="width:min(760px,92vw)"><h1>새 여정 생성 중</h1><div class="progress"><span id="loadingBar" style="width:0"></span></div><div id="loadingLog" class="item-list" style="margin-top:14px"></div></div></div></section>`}
function renderCity(){const d=state.daily;document.getElementById('app').innerHTML=`<section class="scene city-scene">${topbar()}<div class="screen"><div class="scene-head"><div><h1>${state.day}일차 · 도시 페이즈</h1><p>${esc(d.event.text)} <span class="${d.event.delta>0?'good':'bad'}">${family(d.event.family)[1]} ${d.event.delta>0?'상승':'하락'}</span></p></div><div class="scene-actions"><button onclick="Game.openInventory()">보유품</button></div></div><div class="grid location-grid">${CITY_LOCATIONS.map(l=>{const locked=state.shopStage<l.stage;const auctionDone=d.phase!=='city';return `<article class="panel location ${locked?'locked':''}"><div><div class="icon">${l.icon}</div><h2>${l.name}</h2><p>${l.desc}</p>${l.id==='auction'&&auctionDone?'<span class="chip">오늘 경매 완료</span>':''}</div><button ${locked|| (l.id==='auction'&&auctionDone)?'disabled':''} onclick="Game.enterLocation('${l.id}')">${locked?`${l.stage}단계 필요`:'입장'}</button></article>`}).join('')}</div><div class="panel" style="margin-top:14px"><h3>오늘의 준비 상태</h3><div class="grid four"><div><small>수주 의뢰</small><div class="kpi">${d.acceptedQuests.length}</div></div><div><small>감정 완료</small><div class="kpi">${Object.keys(d.appraisals).length}</div></div><div><small>정보 구매</small><div class="kpi">${Object.values(d.info).filter(Boolean).length}</div></div><div><small>판매 가능한 보유품</small><div class="kpi">${sellableInventory().length}</div></div></div></div></div></section>`}
function enterLocation(id){if(id==='auction'){state.scene='auction';prepareAuction()}else{state.scene=id;render();saveState()}}
function goCity(){if(!state||!state.daily){backTitle();return}if(state.daily.settlement){state.scene='exchange';renderExchange('sell');toast('12일차 정산을 끝낸 뒤 진행할 수 있습니다.');return}state.scene='city';render();saveState()}
function renderOffice(tab='quests'){const d=state.daily;const lots=d.lots.filter(l=>d.appraisalOfferIds.includes(l.id));document.getElementById('app').innerHTML=`<section class="scene office-scene">${topbar()}<div class="screen"><div class="scene-head"><div><h1>의뢰소</h1><p>이번 경매의 규칙을 바꾸는 의뢰를 수주하고, 출품 후보의 품질을 정밀 감정합니다.</p></div><button onclick="Game.goCity()">도시로</button></div><div class="tabs"><button class="${tab==='quests'?'active':''}" onclick="Game.renderOffice('quests')">의뢰</button><button class="${tab==='appraisal'?'active':''}" onclick="Game.renderOffice('appraisal')">감정</button></div>${tab==='quests'?`<div class="grid three">${d.questOffers.map(q=>{const accepted=d.acceptedQuests.includes(q.id);const fee=round100(q.fee*scale());return `<article class="panel"><h3>${q.name} 의뢰</h3><p>${q.id==='designated'?`${family(q.targetFamily)[1]} 계열 1점 낙찰`:q.id==='block'?`${q.targetBot==='bennett'?'베넷':'떠돌이 상인'}이 기준액 이상 지출`:q.desc}</p><div class="row between"><span>수주비 <b class="money">${money(fee)}</b></span><span>기본 보상 <b class="good">${money(round100(q.reward*scale()*questBonus()))}</b></span></div><button class="primary" ${accepted||state.cash<fee?'disabled':''} onclick="Game.acceptQuest('${q.id}')">${accepted?'수주 완료':'수주'}</button></article>`}).join('')}</div>`:`<div class="item-list">${lots.map(l=>{const a=d.appraisals[l.id];const cost=round100(l.basePrice*CFG.APPRAISAL_RATE.precise*infoDiscount());return `<article class="item"><div class="row"><div style="font-size:2rem">${family(l.family)[2]}</div><div class="grow"><h3>${l.name}</h3><p>${family(l.family)[1]} · <span class="grade ${grade(l.grade).cls}">${grade(l.grade).label}</span> · 기준가 ${money(l.basePrice)}</p>${a?`<p class="good">감정 결과: 품질 ${a.low.toFixed(2)} ~ ${a.high.toFixed(2)}</p>`:'<p class="muted">품질 비공개</p>'}</div><button ${a?'disabled':''} onclick="Game.appraise('${l.id}')">정밀 감정 ${money(cost)}</button></div></article>`}).join('')}</div>`}</div></section>`}
function acceptQuest(id){const q=state.daily.questOffers.find(x=>x.id===id);if(!q)return;const fee=round100(q.fee*scale());if(state.cash<fee)return toast('자금이 부족합니다.',true);state.cash-=fee;state.daily.expense+=fee;state.daily.acceptedQuests.push(id);saveState();renderOffice('quests');toast('의뢰를 수주했습니다.')}
function appraise(id){const l=state.daily.lots.find(x=>x.id===id);if(!l)return;const cost=round100(l.basePrice*CFG.APPRAISAL_RATE.precise*infoDiscount());if(state.cash<cost)return toast('감정 비용이 부족합니다.',true);state.cash-=cost;state.daily.expense+=cost;const precision=appraisalError(state.day);const center=l.quality*(1+rnd(-precision*.45,precision*.45));state.daily.appraisals[id]={type:'precise',low:clamp(center-precision,.35,1.6),high:clamp(center+precision,.35,1.6)};saveState();renderOffice('appraisal');Sound.playAction('act-reveal-appraisal');toast('감정 결과가 도착했습니다.')}
function infoCost(kind){const total=state.daily.lots.reduce((s,l)=>s+l.basePrice,0);const rate=CFG.INFO_RATE[kind]||0;return round100(total*rate*infoDiscount())}
function renderTavern(){const d=state.daily;const cards=[
{id:'forecast',npc:'항구 서기',name:'수요 동향',cost:infoCost('forecast'),desc:'앞으로 3일의 계열별 사건 방향을 공개한다.'},
{id:'catalog',npc:'경매장 기록관',name:'출품 목록',cost:infoCost('catalog'),desc:'오늘 출품 8점의 계열·등급·기준가를 공개한다.'},
{id:'competitors',npc:'빚쟁이',name:'경쟁자 예산',cost:infoCost('competitors'),desc:'오늘 경쟁자들의 예산 범위와 관심 계열을 공개한다.'}
];document.getElementById('app').innerHTML=`<section class="scene tavern-scene">${topbar()}<div class="screen"><div class="scene-head"><div><h1>술집</h1><p>모든 정보는 거짓이 없는 확정 정보다. 유물 경매 정보는 판매하지 않는다.</p></div><button onclick="Game.goCity()">도시로</button></div><div class="grid three">${cards.map(c=>{const bought=d.info[c.id];return `<article class="panel"><h3>${c.npc}</h3><h2>${c.name}</h2><p>${c.desc}</p><div class="money">${money(c.cost)}</div><button class="primary" ${bought||state.cash<c.cost?'disabled':''} onclick="Game.buyInfo('${c.id}',${c.cost})">${bought?'구매 완료':'구매'}</button></article>`}).join('')}</div><div class="panel" style="margin-top:14px"><h3>확보한 정보</h3>${renderOwnedInfo()}</div></div></section>`}
function renderOwnedInfo(){const d=state.daily;const rows=[];if(state.day>=2)rows.push(`<b>숙적 소문</b>: ${nemesisRumor()}`);if(d.info.forecast){const f=state.marketSchedule.slice(state.day,Math.min(12,state.day+2));rows.push(`<b>수요 동향</b>: ${f.map(e=>`${e.day}일차 ${family(e.family)[1]} ${e.delta>0?'상승':'하락'}`).join(' · ')||'남은 예보 없음'}`)}if(d.info.catalog)rows.push(`<b>출품 목록</b>: ${d.lots.map(l=>`${l.name} · ${family(l.family)[1]} · ${grade(l.grade).label} · ${money(l.basePrice)}`).join(' / ')}`);if(d.info.competitors){const bots=d.bots;rows.push(`<b>경쟁자 예산</b>: ${bots.map(b=>`${b.name} ${money(b.cash*.8)}~${money(b.cash*1.05)} · 관심 ${family(b.target)[1]}`).join(' / ')}`)}return rows.length?rows.map(x=>`<p>${x}</p>`).join(''):'<p class="muted">아직 구매한 정보가 없습니다.</p>'}
function buyInfo(id,cost){if(state.cash<cost)return toast('자금이 부족합니다.',true);state.cash-=cost;state.daily.expense+=cost;state.daily.info[id]=true;saveState();renderTavern();toast('정보를 구매했습니다.')}
function sellableInventory(){return activeInventory().filter(x=>!x.locked&&(x.acquiredDay<state.day||state.daily?.settlement))}
function renderExchange(tab='sell'){document.getElementById('app').innerHTML=`<section class="scene exchange-scene">${topbar()}<div class="screen"><div class="scene-head"><div><h1>거래소${state.daily.settlement?' · 12일차 정산 창':''}</h1><p>낙찰 당일 물품은 다음 날부터 팔 수 있다${state.daily.settlement?' — 정산 창에서는 당일 물품도 가능하다':''}. 족보 판매에는 기한이 없다.</p></div>${state.daily.settlement?'':`<button onclick="Game.goCity()">도시로</button>`}</div><div class="tabs"><button class="${tab==='sell'?'active':''}" onclick="Game.renderExchange('sell')">즉시 처분</button><button class="${tab==='hanbo'?'active':''}" onclick="Game.renderExchange('hanbo')">족보 판매</button><button class="${tab==='market'?'active':''}" onclick="Game.renderExchange('market')">시세판</button></div>${tab==='sell'?renderSellTab():tab==='hanbo'?renderHanboTab():renderMarketTab()}${state.daily.settlement?`<div class="panel" style="margin-top:14px"><button class="primary" onclick="Game.finishSettlement()">정산 종료하고 상회 판정으로</button></div>`:''}</div></section>`}
function renderSellTab(){const inv=sellableInventory();return inv.length?`<div class="item-list">${inv.map(x=>`<article class="item"><div class="row"><div style="font-size:2rem">${family(x.family)[2]}</div><div class="grow"><h3>${x.name}</h3><p>${family(x.family)[1]} · <span class="grade ${grade(x.grade).cls}">${grade(x.grade).label}</span> · 취득가 ${money(x.buyPrice)}</p></div><div><div class="money">처분가 ${money(disposalValue(x))}</div><button onclick="Game.sellItem('${x.id}')">즉시 처분</button></div></div></article>`).join('')}</div>`:`<div class="empty">판매 가능한 보유품이 없습니다.</div>`}
function renderHanboTab(){return `<div class="grid three">${HANBOS.map(h=>{const combo=findHanboCombo(h);return `<article class="panel contract-card"><h2>${h.name}</h2><p>${h.desc}</p><div class="row between"><b>×${h.mult.toFixed(1)}</b><span>${h.need}점 필요</span></div><button class="primary" ${combo?'':'disabled'} onclick="Game.sellHanbo('${h.id}')">${combo?'족보 판매':'조건 미달'}</button></article>`}).join('')}</div><p class="muted" style="margin-top:12px">기한과 수락 절차가 없으며, 조건이 성립하면 언제든 판매할 수 있습니다.</p>`}
function renderMarketTab(){return `<div class="grid three">${FAMILIES.map(f=>`<article class="panel"><div class="row between"><h3>${f[2]} ${f[1]}</h3><b class="${state.market[f[0]]>=1?'good':'bad'}">×${state.market[f[0]].toFixed(2)}</b></div><div class="progress"><span style="width:${clamp(state.market[f[0]]/1.6*100,10,100)}%"></span></div></article>`).join('')}</div><p class="muted" style="margin-top:12px">예보를 구매한 경우에만 미래 방향이 술집 정보에 표시됩니다.</p>`}
function sellItem(id){const x=state.inventory.find(x=>x.id===id);if(!x||x.locked)return;const v=disposalValue(x);x.sold=true;state.cash+=v;state.daily.income+=v;saveState();renderExchange('sell');toast(`${x.name}을 ${money(v)}에 처분했습니다.`)}
function findHanboCombo(def){const inv=sellableInventory();if(def.id==='fullhouse'){const got=[];for(const f of FAMILIES){const x=inv.find(i=>i.family===f[0]&&!got.includes(i));if(!x)return null;got.push(x)}return got}const byFamily=Object.groupBy?Object.groupBy(inv,x=>x.family):inv.reduce((a,x)=>((a[x.family]??=[]).push(x),a),{});for(const arr of Object.values(byFamily)){if(def.id==='pair'&&arr.length>=2)return arr.slice(0,2);if(def.id==='triple'&&arr.length>=3)return arr.slice(0,3);if(def.id==='align'){const grouped={};arr.forEach(x=>(grouped[x.grade]??=[]).push(x));const found=Object.values(grouped).find(x=>x.length>=2);if(found)return found.slice(0,2)}if(def.id==='straight'){const grades=[...new Set(arr.map(x=>x.grade))];if(grades.length>=3)return grades.slice(0,3).map(g=>arr.find(x=>x.grade===g))}if(def.id==='royal'){const hi=arr.filter(x=>['epic','legendary'].includes(x.grade));if(hi.length>=3)return hi.slice(0,3)}}return null}
function sellHanbo(id){const def=HANBOS.find(x=>x.id===id);const combo=findHanboCombo(def);if(!def||!combo)return toast('족보 조건을 충족하지 못했습니다.',true);const base=combo.reduce((sum,item)=>sum+disposalValue(item),0);const total=round10(base*def.mult*setBonus());combo.forEach(item=>item.sold=true);state.cash+=total;state.daily.income+=total;modal={type:'hanboResult',title:`${def.name} 족보 판매`,text:`${combo.length}점을 묶어 ${money(total)}를 받았습니다.`,mult:def.mult};saveState();renderExchange('hanbo');renderModal()}
function renderGuild(){const unlocked=state.shopStage>=3&&!state.guildLocked;const coll=activeInventory().filter(x=>!x.locked&&x.acquiredDay<state.day);document.getElementById('app').innerHTML=`<section class="scene guild-scene">${topbar()}<div class="screen"><div class="scene-head"><div><h1>조합 · 담보 대출</h1><p>역할은 레버리지가 아니라 판매 지연 동안의 유동성 보전이다.</p></div><button onclick="Game.goCity()">도시로</button></div>${!unlocked?`<div class="panel"><h2>${state.guildLocked?'조합 거래 제한':'3단계에서 해금'}</h2><p>${state.guildLocked?'미상환으로 이번 여정의 조합 거래가 제한되었습니다.':'유명 상회(3단계)로 승급하면 이용할 수 있습니다.'}</p></div>`:state.loan?renderLoanStatus():`<div class="grid two"><div class="panel"><h2>담보 선택</h2>${coll.length?coll.map(x=>`<label class="item row"><input type="radio" name="collateral" value="${x.id}"><span class="grow">${x.name}<br><small>처분가 ${money(disposalValue(x))}</small></span><b class="money">한도 ${money(round10(disposalValue(x)*CFG.LOAN_LIMIT))}</b></label>`).join(''):'<div class="empty">담보로 잡을 수 있는 보유품이 없습니다.</div>'}</div><div class="panel"><h2>조건</h2><div class="item-list"><div class="row between"><span>한도</span><b>처분가 ${pct(CFG.LOAN_LIMIT)}</b></div><div class="row between"><span>만기</span><b>2일</b></div><div class="row between"><span>상환액</span><b>원금 ${pct(CFG.LOAN_REPAY_MULTIPLIER)}</b></div><div class="row between"><span>동시 보유</span><b>1건</b></div></div><button class="primary" ${coll.length?'':'disabled'} onclick="Game.takeLoan()">대출 실행</button></div></div>`}</div></section>`}
function renderLoanStatus(){const item=state.inventory.find(x=>x.id===state.loan.collateralId);return `<div class="grid two"><div class="panel"><h2>대출 상태</h2><div class="item-list"><div class="row between"><span>원금</span><b class="money">${money(state.loan.principal)}</b></div><div class="row between"><span>상환 총액</span><b>${money(state.loan.repay)}</b></div><div class="row between"><span>만기</span><b>${state.loan.dueDay}일차 종료 전</b></div><div class="row between"><span>담보</span><b>${item?.name||'압류됨'}</b></div></div><button class="primary" ${state.cash<state.loan.repay?'disabled':''} onclick="Game.repayLoan()">상환</button></div><div class="panel"><h2>주의</h2><p>미상환 시 담보가 압류되고 조합 거래가 제한됩니다. 담보는 보관칸을 차지하며 판매할 수 없습니다.</p></div></div>`}
function takeLoan(){const r=document.querySelector('input[name=collateral]:checked');if(!r)return toast('담보를 선택하세요.',true);const x=state.inventory.find(i=>i.id===r.value);if(!x)return;const p=round10(disposalValue(x)*CFG.LOAN_LIMIT);x.locked=true;state.loan={principal:p,repay:round10(p*CFG.LOAN_REPAY_MULTIPLIER),dueDay:Math.min(12,state.day+2),collateralId:x.id};state.cash+=p;state.daily.income+=p;saveState();renderGuild();toast(`${money(p)}를 대출받았습니다.`)}
function repayLoan(){if(!state.loan||state.cash<state.loan.repay)return;state.cash-=state.loan.repay;state.daily.expense+=state.loan.repay;const x=state.inventory.find(i=>i.id===state.loan.collateralId);if(x)x.locked=false;state.loan=null;saveState();renderGuild();toast('대출을 상환했습니다.')}
function renderMerchant(){const next=state.shopStage+1;const can=next<=4&&state.cash>=CFG.UPGRADE_COST[state.shopStage]&&state.completedQuestsTotal>=CFG.UPGRADE_QUESTS[state.shopStage]&&(state.shopStage!==1||!hasRelic('worn-seal')||true);const questNeed=state.shopStage===1&&hasRelic('worn-seal')?0:CFG.UPGRADE_QUESTS[state.shopStage];const can2=next<=4&&state.cash>=CFG.UPGRADE_COST[state.shopStage]&&state.completedQuestsTotal>=questNeed;document.getElementById('app').innerHTML=`<section class="scene merchant-scene">${topbar()}<div class="screen"><div class="scene-head"><div><h1>상회 · ${stageName(state.shopStage)}</h1><p>성장 브랜치는 별도 자원이 아니라 상회 단계에서 자동으로 파생됩니다.</p></div><button onclick="Game.goCity()">도시로</button></div><div class="grid two"><div class="panel"><h2>승급</h2>${next<=4?`<div class="item-list"><div class="row between"><span>다음 단계</span><b>${stageName(next)}</b></div><div class="row between"><span>누적 의뢰</span><b class="${state.completedQuestsTotal>=questNeed?'good':'bad'}">${state.completedQuestsTotal} / ${questNeed}</b></div><div class="row between"><span>승급비</span><b class="money">${money(CFG.UPGRADE_COST[state.shopStage])}</b></div></div><button class="primary" ${can2?'':'disabled'} onclick="Game.upgradeShop()">즉시 승급</button><p class="muted">조건을 일찍 채워도 즉시 승급할 의무는 없습니다.</p>`:'<div class="good"><h2>최고 단계 도달</h2><p>12일차 유물 경매 자격을 갖췄습니다.</p></div>'}</div><div class="panel"><h2>자동 성장 브랜치</h2><div class="grid two"><div class="item"><h3>정보</h3><b>정보 지출 −${state.shopStage*10}%</b></div><div class="item"><h3>거래</h3><b>낙찰 수수료 ${pct(feeRate())}</b></div><div class="item"><h3>보관</h3><b>세트 정산 +${state.shopStage*10}%</b></div><div class="item"><h3>연줄</h3><b>의뢰 보상 +${state.shopStage*10}%</b></div></div></div></div><div class="panel" style="margin-top:14px"><h2>보유품 관리</h2><p>보관칸 ${activeInventory().length} / ${storageCap()}</p>${activeInventory().length?activeInventory().map(x=>`<span class="chip">${x.locked?'🔒 ':''}${x.name}</span>`).join(' '):'<span class="muted">보유품 없음</span>'}</div></div></section>`}
function upgradeShop(){if(state.shopStage>=4)return;const need=state.shopStage===1&&hasRelic('worn-seal')?0:CFG.UPGRADE_QUESTS[state.shopStage],cost=CFG.UPGRADE_COST[state.shopStage];if(state.completedQuestsTotal<need||state.cash<cost)return toast('승급 조건이 부족합니다.',true);state.cash-=cost;state.daily.expense+=cost;state.shopStage++;saveState();renderMerchant();toast(`${stageName(state.shopStage)}로 승급했습니다.`)}
function renderMuseum(){const meta=getMeta();const inv=state.fromTitle?[]:activeInventory();document.getElementById('app').innerHTML=`<section class="scene museum-scene">${state.fromTitle?'':topbar()}<div class="screen"><div class="scene-head"><div><h1>유물 전시관</h1><p>유물은 여정이 끝나도 영구 보존됩니다.</p></div><button onclick="${state.fromTitle?'Game.backTitle()':'Game.goCity()'}">돌아가기</button></div><div class="grid three">${RELICS.map(r=>{const got=meta.relics.includes(r.id);return `<article class="panel relic-card ${got?'selected':''}"><div style="font-size:2.5rem">${got?r.icon:'❔'}</div><h2>${got?r.name:'미획득 유물'}</h2><p>${got?r.desc:'유물 경매에서 낙찰하면 공개됩니다.'}</p><span class="chip">${r.tier==='low'?'하급':r.tier==='mid'?'중급':'상급'}</span></article>`}).join('')}</div></div></section>`}
function makeBots(){const day=state.day;const base=round100(25000*Math.pow(1.155,day-1)*0.4);const mk=(id,name,nemesis=false)=>({id,name,nemesis,target:pick(FAMILIES)[0],cash:round100(base*rnd(.85,1.15)),passed:false,spent:0});if(day===1)return[mk('drifter-a','떠돌이 상인 A'),mk('drifter-b','떠돌이 상인 B'),mk('drifter-c','떠돌이 상인 C')];state.nemesis.cash=round100(25000*Math.pow(state.nemesis.growth,day-1));return[{id:'bennett',name:'숙적 베넷',nemesis:true,target:state.nemesis.target,cash:state.nemesis.cash,passed:false,spent:0},mk('drifter-a','떠돌이 상인 A'),mk('drifter-b','떠돌이 상인 B')]}
function prepareAuction(){if(state.daily.phase!=='city'&&state.daily.phase!=='auction')return;state.daily.phase='auction';if(!state.daily.auction){state.daily.auction={bots:state.daily.bots,current:null}}if(!state.daily.auction.current)loadLot();render();saveState()}
function loadLot(){const d=state.daily;if(d.lotIndex>=d.lots.length){finishAuctionDay();return}const l=d.lots[d.lotIndex];d.auction.bots.forEach(b=>b.passed=false);const botPlans=Object.fromEntries(d.auction.bots.map(b=>[b.id,makeBotLotPlan(b,l)]));d.auction.current={lotId:l.id,currentBid:l.startingPrice,leader:null,playerPassed:false,botPlans,log:[`시작가 ${money(l.startingPrice)}`]}}
function currentLot(){return state.daily.lots[state.daily.lotIndex]}
function minRaise(){const c=state.daily.auction.current;return Math.max(10,round10(c.currentBid*.10))}
function renderAuction(){const d=state.daily,l=currentLot(),c=d.auction.current,bots=d.auction.bots;const catalogKnown=d.info.catalog;const compKnown=d.info.competitors;const a=d.appraisals[l.id];const capacityFull=activeInventory().length>=storageCap();document.getElementById('app').innerHTML=`<section class="scene auction-scene">${topbar(`<span class="chip">출품 ${d.lotIndex+1}/${d.lots.length}</span>`)}<div class="screen"><div class="auction-layout"><div class="panel lot-stage"><div class="row between"><div><h1>${l.name}</h1><p>${family(l.family)[2]} ${family(l.family)[1]} · <span class="grade ${grade(l.grade).cls}">${grade(l.grade).label}</span> · 기준가 ${money(l.basePrice)}</p>${a?`<p class="good">감정 품질 범위 ${a.low.toFixed(2)}~${a.high.toFixed(2)}</p>`:''}</div><div><small>현재 호가</small><div class="kpi money">${money(c.currentBid)}</div><small>최소 인상 ${money(minRaise())}</small></div></div><div class="lot-art">${family(l.family)[2]}</div><div><div class="bid-controls"><label>직접 입찰가<input id="bidInput" type="number" step="10" min="${c.currentBid+minRaise()}" value="${c.currentBid+minRaise()}" ${c.playerPassed||capacityFull?'disabled':''}></label><button class="primary" ${c.playerPassed||capacityFull?'disabled':''} onclick="Game.placeBid()">입찰</button><button ${c.playerPassed?'disabled':''} onclick="Game.passLot()">물러나기</button></div>${capacityFull?'<p class="bad">보관칸이 가득 차 입찰할 수 없습니다.</p>':''}<p class="muted">자유 입력 공개 호가. 최소 인상폭은 현재 호가의 10%입니다.</p></div></div><aside class="grid"><div class="panel"><h2>참가자</h2><div class="bot-list"><div class="bot ${c.leader==='player'?'selected':''}"><div class="row between"><b>플레이어</b><span>${c.playerPassed?'물러남':money(state.cash)}</span></div></div>${bots.map(b=>`<div class="bot ${b.nemesis?'nemesis':''} ${c.leader===b.id?'selected':''}"><div class="row between"><b>${b.name}</b><span>${b.passed?'물러남':compKnown?money(b.cash):'예산 비공개'}</span></div><small>${compKnown?`표적 ${family(b.target)[1]}`:'표적 비공개'}</small></div>`).join('')}</div></div><div class="panel"><h2>입찰 기록</h2><div class="log">${c.log.map(x=>`<div class="log-line">${x}</div>`).join('')}</div></div><div class="panel"><h3>출품 목록</h3><p>${catalogKnown?d.lots.map(x=>`${x.name} · ${family(x.family)[1]} · ${grade(x.grade).label} · ${money(x.basePrice)}`).join('<br>'):'구매하지 않음'}</p></div></aside></div></div></section>`}
function botEstimateNoise(bot){if(!bot.nemesis)return .38;return [.30,.22,.15,.12][nemesisStage()]}
function makeBotLotPlan(bot,l){const affinity=bot.target===l.family?1.18:1;const gradeRisk={common:.9,rare:1,epic:1.05,legendary:1.1}[l.grade];const estimate=clamp(1+rnd(-botEstimateNoise(bot),botEstimateNoise(bot)),.55,1.55);const marketAxis=round10(l.basePrice*estimate*demandOf(l)*affinity*gradeRisk*(bot.nemesis?nemesisBonus():1));const circumstanceAxis=round10(l.basePrice*rnd(.65,1.55)*(bot.target===l.family?1.12:1));return{estimate,marketAxis,circumstanceAxis,cap:Math.min(bot.cash,Math.max(marketAxis,circumstanceAxis))}}
function botCap(bot,l){const c=state.daily.auction.current;c.botPlans=c.botPlans||{};c.botPlans[bot.id]=c.botPlans[bot.id]||makeBotLotPlan(bot,l);return c.botPlans[bot.id].cap}
function botCycle(){const d=state.daily,l=currentLot(),c=d.auction.current;let bidder=null;for(const b of d.auction.bots){if(b.passed)continue;const next=c.currentBid+minRaise();const cap=botCap(b,l);if(next<=cap&&next<=b.cash&&Math.random()<.78){bidder=b;break}else b.passed=true}if(bidder){const wasLeader=c.leader;const bid=c.currentBid+minRaise();c.currentBid=bid;c.leader=bidder.id;c.log.unshift(`${bidder.name} ${money(bid)}`);Sound.playAction('act-run-bot-turn');if(wasLeader==='player')setTimeout(()=>Sound.playCue('sfx-outbid'),150);renderAuction();return false}return true}
function placeBid(){const c=state.daily.auction.current,l=currentLot();const v=Number(document.getElementById('bidInput').value),min=c.currentBid+minRaise(),total=round10(v*(1+feeRate()));if(!Number.isFinite(v)||v<min)return toast(`최소 ${money(min)} 이상이어야 합니다.`,true);if(total>state.cash)return toast(`수수료 포함 ${money(total)}가 필요합니다.`,true);c.currentBid=round10(v);c.leader='player';c.log.unshift(`플레이어 ${money(c.currentBid)}`);const botsDone=botCycle();if(botsDone)finalizeLot('player');else saveState()}
function passLot(){const c=state.daily.auction.current;c.playerPassed=true;c.log.unshift('플레이어가 물러났습니다.');while(!botCycle()){}finalizeLot(c.leader)}
function finalizeLot(winner){const d=state.daily,l=currentLot(),c=d.auction.current;Sound.playAction('act-finalize-lot');if(!winner)winner=c.leader;if(winner==='player'){const fee=round10(c.currentBid*feeRate()),total=c.currentBid+fee;state.cash-=total;d.expense+=total;l.wonBy='player';l.finalPrice=c.currentBid;l.buyPrice=c.currentBid;l.acquiredDay=state.day;state.inventory.push({...l,locked:false,sold:false,seized:false,fee});d.auctionResults.push({lotId:l.id,name:l.name,winner:'player',price:c.currentBid,fee})}else if(winner){const b=d.auction.bots.find(x=>x.id===winner);if(b){b.cash-=c.currentBid;b.spent+=c.currentBid;d.botSpend[b.id]=(d.botSpend[b.id]||0)+c.currentBid;l.wonBy=b.id;l.finalPrice=c.currentBid;d.auctionResults.push({lotId:l.id,name:l.name,winner:b.name,price:c.currentBid,fee:0})}}else d.auctionResults.push({lotId:l.id,name:l.name,winner:'유찰',price:0,fee:0});const lotResult=d.auctionResults.at(-1);setTimeout(()=>Sound.playCue(lotResult.winner==='player'?'sfx-lot-win':'sfx-lot-lose'),1050);modal={type:'lotResult',result:lotResult};saveState();renderModal()}
function nextLot(){closeModal();state.daily.lotIndex++;state.daily.auction.current=null;if(state.daily.lotIndex>=state.daily.lots.length){finishAuctionDay()}else{loadLot();state.scene='auction';render();saveState()}}
function finishAuctionDay(){const bennett=state.daily.auction?.bots?.find(b=>b.id==='bennett');if(bennett)state.nemesis.cash=bennett.cash;resolveQuests();state.daily.phase='summary';state.scene='summary';saveState();render()}
function resolveQuests(){const d=state.daily,wins=d.auctionResults.filter(x=>x.winner==='player');d.questResults=[];for(const id of d.acceptedQuests){const q=d.questOffers.find(x=>x.id===id);let ok=false;if(id==='designated')ok=wins.some(w=>d.lots.find(l=>l.id===w.lotId)?.family===q.targetFamily);if(id==='multi')ok=new Set(wins.map(w=>d.lots.find(l=>l.id===w.lotId)?.family)).size>=2;if(id==='bargain')ok=wins.some(w=>{const l=d.lots.find(x=>x.id===w.lotId);return w.price<=l.basePrice*.85});if(id==='restraint')ok=wins.length>0&&state.cash>=state.startDayCash*.6;if(id==='block')ok=(d.botSpend[q.targetBot]||0)>=round100(3500*scale())&&!wins.some(w=>w.winner===q.targetBot);const fixedReward=ok?round100(q.reward*scale()*questBonus()):0;const variableReward=ok&&id==='block'?round100((d.botSpend[q.targetBot]||0)*.30):0;const reward=fixedReward+variableReward;if(ok){state.cash+=reward;d.income+=reward;state.completedQuestsTotal++}d.questResults.push({id,name:q.name,ok,reward})}}
function renderSummary(){const d=state.daily,wins=d.auctionResults.filter(x=>x.winner==='player');document.getElementById('app').innerHTML=`<section class="scene summary-scene">${topbar()}<div class="screen"><div class="scene-head"><div><h1>${state.day}일차 하루 결산</h1><p>낙찰과 판매 사이의 하루 간격이 시세 리스크를 만듭니다.</p></div></div><div class="grid three"><div class="panel"><h2>출품 결과</h2><div class="item-list">${d.auctionResults.map(x=>`<div class="row between"><span>${x.name}</span><b>${x.winner==='player'?'낙찰':x.winner}</b></div>`).join('')}</div></div><div class="panel"><h2>획득 물품</h2>${wins.length?wins.map(x=>`<p>${x.name} · ${money(x.price)}</p>`).join(''):'<p class="muted">획득 없음</p>'}<hr><h2>자금 내역</h2><div class="row between"><span>지출</span><b class="bad">-${money(d.expense)}</b></div><div class="row between"><span>수입</span><b class="good">+${money(d.income)}</b></div><div class="row between"><span>현재 자금</span><b class="money">${money(state.cash)}</b></div></div><div class="panel"><h2>의뢰 판정·마감</h2>${d.questResults.length?d.questResults.map(q=>`<div class="row between"><span>${q.name}</span><b class="${q.ok?'good':'bad'}">${q.ok?`성공 +${money(q.reward)}`:'실패'}</b></div>`).join(''):'<p class="muted">수주한 의뢰 없음</p>'}<hr><p>${deadlineText()||'마감 조건을 모두 통과했습니다.'}</p><p>현재 ${state.shopStage}단계 · 누적 의뢰 ${state.completedQuestsTotal}건</p></div></div><div class="panel" style="margin-top:14px"><h2>계열 지수</h2><div class="grid three">${FAMILIES.map(f=>`<div class="row between"><span>${f[2]} ${f[1]}</span><b class="${state.market[f[0]]>=1?'good':'bad'}">×${state.market[f[0]].toFixed(2)}</b></div>`).join('')}</div><div class="modal-actions">${state.day<12?`<button class="primary" onclick="Game.nextDay()">다음 날</button>`:`<button class="primary" onclick="Game.openSettlement()">12일차 정산 창</button>`}</div></div></div></section>`}
function nextDay(){if(bankruptcyCheck())return;state.day++;state.daily=null;saveState();startDay()}
function openSettlement(){state.daily.settlement=true;state.scene='exchange';renderExchange('sell');saveState()}
function finishSettlement(){state.scene='ending';render();saveState()}
function renderEnding(){const qualified=state.shopStage>=4;document.getElementById('app').innerHTML=`<section class="scene ending-scene">${topbar()}<div class="screen" style="display:grid;place-items:center"><div class="panel" style="width:min(900px,94vw)"><h1>12일 여정 판정</h1><div class="grid two"><div class="panel inset"><small>상회 단계</small><div class="kpi">${stageName(state.shopStage)}</div></div><div class="panel inset"><small>최종 자금</small><div class="kpi money">${money(state.cash)}</div></div></div><hr>${qualified?`<h2 class="good">유물 경매 입장 자격 획득</h2><p>대상회에 도달했습니다. 하급 → 중급 → 상급 3라운드 공개 호가로 진행합니다.</p><button class="primary" onclick="Game.startFinalAuction()">유물 경매 입장</button>`:`<h2 class="bad">유물 경매 자격 미달</h2><p>상회 4단계에 도달하지 못했습니다.</p><button onclick="Game.endRunNoRelic()">런 결과로</button>`}</div></div></section>`}
function makeTycoonProfiles(){return FINAL_TYCOON_BLUEPRINTS.map(p=>({id:p.id,name:p.name,cash:round100(rnd(p.cashRange[0],p.cashRange[1])),intent:Number(rnd(p.intentRange[0],p.intentRange[1]).toFixed(3)),alloc:p.allocationRanges.map(r=>Number(rnd(r[0],r[1]).toFixed(3))) }))}
function makeFinalBots(){if(!state.tycoons)state.tycoons=makeTycoonProfiles();return state.tycoons.map(p=>({...p,passed:false,spent:0,target:'relic'}))}
function startFinalAuction(){const pool={low:shuffle(RELICS.filter(x=>x.tier==='low')),mid:shuffle(RELICS.filter(x=>x.tier==='mid')),high:shuffle(RELICS.filter(x=>x.tier==='high'))};state.finalAuction={round:0,relics:[pool.low[0],pool.mid[0],pool.high[0]],bots:makeFinalBots(),current:null,wins:[]};state.scene='final';loadFinalRound();render();saveState()}
function loadFinalRound(){const f=state.finalAuction;if(f.round>=3){finishFinalAuction();return}f.bots.forEach(b=>b.passed=false);const starts=[12000,25000,45000];f.current={currentBid:starts[f.round],leader:null,playerPassed:false,log:[`시작가 ${money(starts[f.round])}`]}}
function finalMinRaise(){return Math.max(100,round100(state.finalAuction.current.currentBid*.1))}
function finalCap(bot){return bot.cash*bot.intent*bot.alloc[state.finalAuction.round]}
function renderFinalAuction(){const f=state.finalAuction,r=f.relics[f.round],c=f.current;document.getElementById('app').innerHTML=`<section class="scene final-scene">${topbar(`<span class="chip">유물 경매 ${f.round+1}/3</span>`)}<div class="screen"><div class="auction-layout"><div class="panel lot-stage"><div class="row between"><div><h1>${r.icon} ${r.name}</h1><p>${r.desc}</p><span class="chip">${r.tier==='low'?'하급':r.tier==='mid'?'중급':'상급'}</span></div><div><small>현재 호가</small><div class="kpi money">${money(c.currentBid)}</div><small>최소 인상 ${money(finalMinRaise())}</small></div></div><div class="lot-art">${r.icon}</div><div><div class="bid-controls"><label>입찰가<input id="finalBidInput" type="number" step="100" min="${c.currentBid+finalMinRaise()}" value="${c.currentBid+finalMinRaise()}" ${c.playerPassed?'disabled':''}></label><button class="primary" ${c.playerPassed?'disabled':''} onclick="Game.placeFinalBid()">입찰</button><button ${c.playerPassed?'disabled':''} onclick="Game.passFinal()">물러나기</button></div><p class="muted">12일간 사용한 공개 호가와 같은 방식입니다.</p></div></div><aside class="grid"><div class="panel"><h2>거물 3인</h2>${f.bots.map(b=>`<div class="bot ${c.leader===b.id?'selected':''}"><div class="row between"><b>${b.name}</b><span>${b.passed?'물러남':'자금 비공개'}</span></div></div>`).join('')}</div><div class="panel"><h2>입찰 기록</h2><div class="log">${c.log.map(x=>`<div class="log-line">${x}</div>`).join('')}</div></div></aside></div></div></section>`}
function finalBotCycle(){const f=state.finalAuction,c=f.current;let bidder=null;for(const b of f.bots){if(b.passed)continue;const next=c.currentBid+finalMinRaise();if(next<=finalCap(b)&&next<=b.cash&&Math.random()<.82){bidder=b;break}else b.passed=true}if(bidder){const bid=c.currentBid+finalMinRaise();c.currentBid=bid;c.leader=bidder.id;c.log.unshift(`${bidder.name} ${money(bid)}`);Sound.playAction('act-run-tycoon-turn');renderFinalAuction();return false}return true}
function placeFinalBid(){const c=state.finalAuction.current;const v=Number(document.getElementById('finalBidInput').value),min=c.currentBid+finalMinRaise();if(v<min)return toast(`최소 ${money(min)} 이상이어야 합니다.`,true);if(v>state.cash)return toast('자금이 부족합니다.',true);c.currentBid=round100(v);c.leader='player';c.log.unshift(`플레이어 ${money(c.currentBid)}`);if(finalBotCycle())finalizeFinal('player');else saveState()}
function passFinal(){const c=state.finalAuction.current;c.playerPassed=true;c.log.unshift('플레이어가 물러났습니다.');while(!finalBotCycle()){}finalizeFinal(c.leader)}
function finalizeFinal(winner){const f=state.finalAuction,c=f.current,r=f.relics[f.round];Sound.playAction('act-finish-relic-auction');if(winner==='player'){state.cash-=c.currentBid;f.wins.push(r);setTimeout(()=>Sound.playCue('sfx-relic-acquire'),900);modal={type:'finalResult',title:`${r.name} 낙찰`,text:`${money(c.currentBid)}에 영구 유물을 낙찰했습니다.`}}else{const b=f.bots.find(x=>x.id===winner);if(b){b.cash-=c.currentBid;b.spent+=c.currentBid}setTimeout(()=>Sound.playCue('sfx-relic-lost'),900);modal={type:'finalResult',title:`${r.name} 낙찰 실패`,text:`${b?.name||'거물'}이 ${money(c.currentBid)}에 낙찰했습니다.`}}renderModal();saveState()}
function nextFinalRound(){closeModal();state.finalAuction.round++;loadFinalRound();if(state.finalAuction.round<3){state.scene='final';render();saveState()}}
function finishFinalAuction(){const wins=state.finalAuction.wins;if(!wins.length){endRun('empty-relic','유물 경매에서 한 점도 낙찰하지 못했습니다.');return}const meta=getMeta();for(const r of wins)if(!meta.relics.includes(r.id))meta.relics.push(r.id);meta.runs=(meta.runs||0)+1;meta.carry=Math.round(state.cash*(meta.relics.includes('merchant-safe')?.45:.4));setMeta(meta);state.runResults.push({type:'relic',wins:wins.map(x=>x.id)});state.scene='result';state.runEnded=true;saveState();render()}
function endRunNoRelic(){endRun('qualification','유물 경매 입장 자격을 얻지 못했습니다.')}
function endRun(type,reason){state.runEnded=true;state.ending={type,reason};state.scene='result';saveState();render()}
function renderResult(){const failed=state.ending&&state.ending.type!=='relic';const wins=state.finalAuction?.wins||[];const cls=state.ending?.type==='bankruptcy'?'bankruptcy-scene':'result-scene';document.getElementById('app').innerHTML=`<section class="scene ${cls}"><div class="screen" style="display:grid;place-items:center"><div class="panel" style="width:min(920px,94vw)"><h1>${failed?'여정 종료':'여정 완료'}</h1>${failed?`<h2 class="bad">${esc(state.ending.reason)}</h2>`:`<h2 class="good">영구 유물 ${wins.length}점 획득</h2><div class="grid three">${wins.map(r=>`<div class="panel inset"><div style="font-size:2.4rem">${r.icon}</div><h3>${r.name}</h3><p>${r.desc}</p></div>`).join('')}</div>`}<hr><div class="grid three"><div><small>최종 단계</small><div class="kpi">${stageName(state.shopStage)}</div></div><div><small>최종 자금</small><div class="kpi money">${money(state.cash)}</div></div><div><small>영구 유물 총계</small><div class="kpi">${getMeta().relics.length} / 9</div></div></div><div class="modal-actions"><button onclick="Game.backTitle()">타이틀</button><button onclick="Game.openMuseumResult()">전시관</button>${!failed?'<button class="primary" onclick="Game.newJourney()">다음 여정</button>':''}</div></div></div></section>`}
function openMuseumResult(){state.fromTitle=true;state.scene='museum';render()}
function newJourney(){newRun(state.slot||1)}
function renderModal(){const root=document.getElementById('modal-root');if(!modal){root.innerHTML='';Sound.onModal(null);return}let inner='';if(modal.type==='confirm'){inner=`<h1>${esc(modal.title)}</h1><p>${esc(modal.text)}</p><div class="modal-actions"><button onclick="Game.closeModal()">취소</button><button class="danger" id="confirmBtn">확인</button></div>`}if(modal.type==='settings'){inner=`<h1>설정</h1><div class="item-list"><label class="row between"><span>마스터 음량</span><input id="setMasterVolume" type="range" min="0" max="100" value="${settings.masterVolume}"></label><label class="row between"><span>BGM 음량</span><input id="setBgmVolume" type="range" min="0" max="100" value="${settings.bgmVolume}"></label><label class="row between"><span>SFX 음량</span><input id="setSfxVolume" type="range" min="0" max="100" value="${settings.sfxVolume}"></label><label class="row between"><span>고대비</span><input id="setContrast" type="checkbox" ${settings.contrast?'checked':''}></label><label class="row between"><span>텍스트 크기</span><input id="setScale" type="range" min="85" max="125" value="${settings.textScale}"></label><label class="row between"><span>QA 빠른 진행</span><input id="setQa" type="checkbox" ${settings.qa?'checked':''}></label><label class="row between"><span>첫날 튜토리얼</span><input id="setTutorial" type="checkbox" ${settings.tutorial?'checked':''}></label></div><div class="modal-actions"><button onclick="Game.closeModal()">취소</button><button class="primary" onclick="Game.applySettingsModal()">적용</button></div>`}if(modal.type==='lotResult'){const r=modal.result;inner=`<h1>출품 결과</h1><h2 class="${r.winner==='player'?'good':''}">${r.winner==='player'?'플레이어 낙찰':r.winner==='유찰'?'유찰':`${r.winner} 낙찰`}</h2><p>${r.name} · ${r.price?money(r.price):'입찰 없음'}</p>${r.fee?`<p>낙찰 수수료 ${money(r.fee)}</p>`:''}<div class="modal-actions"><button class="primary" onclick="Game.nextLot()">확인</button></div>`}if(modal.type==='hanboResult'){inner=`<h1>${esc(modal.title)}</h1><p>${esc(modal.text)}</p><p>기본 배수 ×${modal.mult.toFixed(1)} · 상회 단계 보정 적용</p><div class="modal-actions"><button class="primary" onclick="Game.closeModal()">확인</button></div>`}if(modal.type==='finalResult'){inner=`<h1>${esc(modal.title)}</h1><p>${esc(modal.text)}</p><div class="modal-actions"><button class="primary" onclick="Game.nextFinalRound()">다음 라운드</button></div>`}root.innerHTML=`<div class="modal-backdrop"><div class="modal ${modal.type==='settings'?'large':''}">${inner}</div></div>`;Sound.onModal(modal.type);if(modal.type==='confirm')setTimeout(()=>{const b=document.getElementById('confirmBtn');if(b)b.onclick=()=>{const fn=modal.onConfirm;closeModal();fn()}},0)}
function renderQA(){document.querySelector('.qa')?.remove();if(!settings.qa||!state||!state.daily)return;document.body.insertAdjacentHTML('beforeend',`<div class="qa"><button onclick="Game.qaCash()">+50,000G</button><button onclick="Game.qaStage()">다음 단계</button>${state.scene==='auction'?'<button onclick="Game.qaResolveAuction()">남은 경매 자동</button>':''}</div>`)}
function qaCash(){state.cash+=50000;saveState();render()}
function qaStage(){if(state.shopStage<4)state.shopStage++;saveState();render()}
function qaResolveAuction(){while(state.daily.lotIndex<state.daily.lots.length){const l=currentLot(),c=state.daily.auction.current;c.leader=Math.random()<.5?'player':state.daily.auction.bots[0].id;c.currentBid=round100(l.startingPrice*rnd(1,1.8));if(c.leader==='player'&&state.cash>=c.currentBid*(1+feeRate())&&activeInventory().length<storageCap())finalizeLot('player');else finalizeLot(state.daily.auction.bots[0].id);modal=null;state.daily.lotIndex++;state.daily.auction.current=null;if(state.daily.lotIndex<state.daily.lots.length)loadLot()}finishAuctionDay()}
const Game={
newRun,openContinue,openMuseumFromTitle,exitGame,loadSlot:loadState,askDelete:(slot)=>openConfirm('저장 삭제',`${slot}번 저장을 삭제하시겠습니까?`,()=>deleteState(slot)),backTitle:()=>{state=null;renderTitle()},openSettings,closeModal,applySettingsModal:()=>{settings.contrast=document.getElementById('setContrast').checked;settings.textScale=Number(document.getElementById('setScale').value);settings.qa=document.getElementById('setQa').checked;settings.tutorial=document.getElementById('setTutorial').checked;settings.masterVolume=Number(document.getElementById('setMasterVolume').value);settings.bgmVolume=Number(document.getElementById('setBgmVolume').value);settings.sfxVolume=Number(document.getElementById('setSfxVolume').value);saveSettings();closeModal();render()},saveCurrent:()=>{saveState();toast('저장했습니다.')},goCity,openInventory:()=>{state.scene='merchant';render()},enterLocation,renderOffice,acceptQuest,appraise,buyInfo,renderExchange,sellItem,sellHanbo,takeLoan,repayLoan,upgradeShop,placeBid,passLot,nextLot,nextDay,openSettlement,finishSettlement,startFinalAuction,placeFinalBid,passFinal,nextFinalRound,endRunNoRelic,openMuseumResult,newJourney,qaCash,qaStage,qaResolveAuction};
window.Game=Game;Sound.bindGame(Game);applySettings();renderTitle();
</script>
